{% extends "base.html" %}
{% block title %}Register - Kanwar Sahayata (Demo){% endblock %}
{% block content %}
<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 max-w-md mx-auto">
  <p class="text-xs font-semibold text-emerald-700 uppercase tracking-wide mb-1">Step 1 of 5</p>
  <h1 class="text-xl font-bold mb-1">Pilgrim registration</h1>
  <p class="text-sm text-slate-500 mb-6">Start with the pilgrim's mobile number.</p>
  <form method="post" action="/ui/register" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Mobile number</label>
      <input name="phone" inputmode="numeric" required value="{{ phone }}" placeholder="98XXXXXXXX"
             class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-600">
    </div>
    <button class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold rounded-lg py-2.5">Continue</button>
  </form>
</div>
{% endblock %}
