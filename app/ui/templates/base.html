<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kanwar Sahayata (Demo){% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900">
  <div class="bg-amber-400 text-amber-950 text-center text-sm font-semibold py-1.5 px-4">
    LOCAL DEMO - fake data, demo OTP, not a real emergency service
  </div>
  <header class="bg-emerald-800 text-white px-6 py-4 flex items-center justify-between">
    <a href="/ui/dashboard" class="text-lg font-bold tracking-tight">Kanwar Sahayata</a>
    {% if user %}
    <div class="flex items-center gap-3 text-sm">
      <span>{{ user.full_name or user.phone }}</span>
      <span class="bg-emerald-700 rounded-full px-3 py-0.5 text-xs uppercase tracking-wide">{{ user.role.name if user.role else 'user' }}</span>
      <a href="/ui/logout" class="underline underline-offset-2">Log out</a>
    </div>
    {% endif %}
  </header>
  <main class="max-w-3xl mx-auto px-4 py-8">
    {% if error %}
    <div class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-800 px-4 py-3 text-sm">{{ error }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
