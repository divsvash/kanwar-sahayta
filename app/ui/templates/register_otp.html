{% extends "base.html" %}
{% block title %}Verify - Kanwar Sahayata (Demo){% endblock %}
{% block content %}
<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 max-w-md mx-auto">
  <p class="text-xs font-semibold text-emerald-700 uppercase tracking-wide mb-1">Step 2 of 5</p>
  <h1 class="text-xl font-bold mb-4">Verify phone</h1>
  <div class="rounded-lg bg-amber-50 border border-amber-300 text-amber-900 px-4 py-3 text-sm mb-6">
    <strong>Demo mode:</strong> no SMS is actually sent. Use the demo OTP:
    <span class="font-mono font-bold text-base">{{ demo_otp }}</span>
  </div>
  <form method="post" action="/ui/register/otp" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">6-digit OTP</label>
      <input name="otp" inputmode="numeric" maxlength="6" required
             class="w-full rounded-lg border border-slate-300 px-3 py-2 font-mono tracking-widest focus:outline-none focus:ring-2 focus:ring-emerald-600">
    </div>
    <button class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold rounded-lg py-2.5">Verify</button>
  </form>
</div>
{% endblock %}
