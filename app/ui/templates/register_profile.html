{% extends "base.html" %}
{% block title %}Profile - Kanwar Sahayata (Demo){% endblock %}
{% block content %}
<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 max-w-md mx-auto">
  <p class="text-xs font-semibold text-emerald-700 uppercase tracking-wide mb-1">Step 3 of 5</p>
  <h1 class="text-xl font-bold mb-6">Pilgrim details</h1>
  <form method="post" action="/ui/register/profile" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Full name *</label>
      <input name="full_name" required class="w-full rounded-lg border border-slate-300 px-3 py-2">
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium mb-1">Age</label>
        <input name="age" type="number" min="5" max="120" class="w-full rounded-lg border border-slate-300 px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Gender</label>
        <select name="gender" class="w-full rounded-lg border border-slate-300 px-3 py-2">
          <option value="">-</option><option>male</option><option>female</option><option>other</option>
        </select>
      </div>
    </div>
    <hr class="border-slate-200">
    <p class="text-sm font-medium text-slate-600">Emergency contact (optional)</p>
    <div>
      <label class="block text-sm font-medium mb-1">Name</label>
      <input name="emergency_contact_name" class="w-full rounded-lg border border-slate-300 px-3 py-2">
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium mb-1">Phone</label>
        <input name="emergency_contact_phone" inputmode="numeric" class="w-full rounded-lg border border-slate-300 px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Relation</label>
        <input name="emergency_contact_relation" placeholder="father, spouse..." class="w-full rounded-lg border border-slate-300 px-3 py-2">
      </div>
    </div>
    <button class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold rounded-lg py-2.5">Continue</button>
  </form>
</div>
{% endblock %}
