{% extends "base.html" %}
{% block title %}Route - Kanwar Sahayata (Demo){% endblock %}
{% block content %}
<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 max-w-md mx-auto">
  <p class="text-xs font-semibold text-emerald-700 uppercase tracking-wide mb-1">Step 5 of 5</p>
  <h1 class="text-xl font-bold mb-6">Choose the yatra route</h1>
  <form method="post" action="/ui/register/route" class="space-y-4">
    <div class="space-y-2">
      {% for route in routes %}
      <label class="flex items-start gap-3 rounded-xl border border-slate-300 p-4 cursor-pointer hover:border-emerald-600">
        <input type="radio" name="route_id" value="{{ uuid_hex(route.id) }}" required class="mt-1">
        <span>
          <span class="block font-semibold">{{ route.name }}</span>
          {% if route.description %}<span class="block text-sm text-slate-500">{{ route.description }}</span>{% endif %}
          {% if route.total_distance_km %}<span class="block text-xs text-slate-400 mt-1">{{ route.total_distance_km }} km{% if route.estimated_hours %} - ~{{ route.estimated_hours }} hrs{% endif %}</span>{% endif %}
        </span>
      </label>
      {% endfor %}
    </div>
    <button class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold rounded-lg py-2.5">Finish registration</button>
  </form>
</div>
{% endblock %}
