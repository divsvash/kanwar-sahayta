# Alembic config for the MySQL deployment path.
# The SQLite demo does not use migrations (run_demo.py uses create_all).
[alembic]
script_location = alembic
sqlalchemy.url = mysql+asyncmy://root:changethis@localhost:3306/kanwar_sahayata

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
